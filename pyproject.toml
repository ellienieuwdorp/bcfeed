[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Conservative default set; the audit's real bugs are fixed in their own WPs,
# not by autofix. E501 (line length) is handled by the formatter.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length — formatter owns wrapping
    "B008",   # function calls in argument defaults (Flask/console patterns)
    # The following flag real defects tracked as audit findings; the fixes (not
    # blanket suppression) land in their WPs, which remove these ignores:
    "B904",   # raise ... from — exception chaining hygiene (WP-04/06/16)
    "E721",   # type(x) == ... comparisons — PY-9 (WP-06)
    "E722",   # bare except — PY-11 (WP-04/16)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F401"]

[tool.ruff.format]
quote-style = "double"
